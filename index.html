<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DFC | Treinamento Pesado | Professor Moreira</title><style>
:root{--blue:#071c83;--yellow:#ffdf24;--white:#fff}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 80% 10%,#215ce0,transparent 45%),linear-gradient(135deg,#050c4e,#122ba2 65%,#07104c);color:white;font-family:Arial,system-ui,sans-serif}main{max-width:850px;margin:auto;min-height:100dvh;padding:16px;display:flex;flex-direction:column;gap:14px}.brand{text-align:center;font-weight:900;color:var(--yellow);font-size:clamp(17px,3.4vw,25px);text-transform:uppercase}.panel{background:#07145bcf;border:3px solid #ffe232;border-radius:23px;padding:clamp(18px,4vw,30px);box-shadow:0 8px 30px #0005;flex:1}.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:25px}.cover h1{font-size:clamp(29px,7vw,55px);color:var(--yellow);margin:0}.cover h2{font-size:clamp(23px,5vw,36px);margin:0}.big{font-size:clamp(19px,3.8vw,27px);line-height:1.35;font-weight:750}.tag{display:inline-block;background:var(--yellow);color:#07145b;border-radius:999px;padding:8px 15px;font-weight:900}.options{display:grid;gap:11px;margin:22px 0}.option{width:100%;text-align:left;background:#fff;color:#061257;border:3px solid transparent;border-radius:13px;padding:15px;font-size:clamp(17px,3.5vw,23px);font-weight:750;line-height:1.3;cursor:pointer}.option:disabled{opacity:1;cursor:default}.option.good{background:#13b95c;color:white;border-color:#8bffae}.option.bad{background:#e52d39;color:white;border-color:#ffb4b4}.feedback{border-radius:13px;padding:16px;font-size:clamp(17px,3.4vw,22px);line-height:1.4;background:#1533a5;border:2px solid #ffe232;margin-top:16px}.feedback strong{color:#ffec58}.nav{display:flex;gap:9px;justify-content:space-between;position:sticky;bottom:0;background:#07134c;padding:10px;border-radius:15px}.btn{background:var(--yellow);color:#07145b;border:0;border-radius:12px;padding:13px 15px;font-weight:900;font-size:clamp(15px,3vw,21px);cursor:pointer}.btn:disabled{opacity:.35}.muted{color:#e7ebff;font-size:17px}.progress{height:12px;background:#273878;border-radius:20px;overflow:hidden}.bar{height:100%;background:var(--yellow);transition:width .2s}.score{font-size:clamp(48px,12vw,90px);font-weight:900;color:var(--yellow);text-align:center}.small{font-size:15px;color:#f0f1ff;text-align:center}.hidden{display:none}h3{color:var(--yellow);font-size:25px}button:focus-visible{outline:4px solid white;outline-offset:2px}</style></head><body><main><div class="brand">CURSO DE CONTABILIDADE PROFESSOR MOREIRA</div><div class="progress"><div id="bar" class="bar" style="width:0%"></div></div><section id="screen" class="panel"></section><nav class="nav"><button class="btn" id="prev">⬅ Voltar</button><button class="btn" id="reset">↻ Reiniciar</button><button class="btn" id="next">Avançar ➡</button></nav><div class="small">CPC 03 (R2) • Questões inéditas de treinamento • Funciona sem internet</div></main><script>
const qs=[
{q:'Assinale a alternativa que apresenta somente transações classificadas como atividades operacionais na DFC.',o:['Recebimento de clientes; pagamento a fornecedores; pagamento de salários.','Venda à vista de imobilizado; pagamento a fornecedores; recebimento de clientes.','Emissão de ações; pagamento de salários; compra de estoques.','Amortização de empréstimos; recebimento de clientes; pagamento de tributos.','Compra à vista de intangível; pagamento de salários; recebimento de clientes.'],a:0,e:'Recebimentos de clientes e pagamentos a fornecedores e empregados são fluxos operacionais. Venda de imobilizado e compra de intangível são investimentos; emissão de ações e amortização do principal de empréstimos são financiamentos.'},
{q:'Uma companhia recebeu R$ 120.000 pela venda à vista de uma máquina e pagou R$ 75.000 pela aquisição à vista de equipamentos. Qual é o fluxo líquido de investimento dessas duas operações?',o:['Saída líquida de R$ 195.000.','Entrada líquida de R$ 45.000.','Entrada líquida de R$ 120.000.','Saída líquida de R$ 75.000.','Entrada líquida de R$ 195.000.'],a:1,e:'Investimento: entrada de R$ 120.000 menos saída de R$ 75.000 = entrada líquida de R$ 45.000.'},
{q:'Assinale a alternativa que contém apenas fluxos de caixa das atividades de financiamento.',o:['Aquisição à vista de ações de outra empresa; pagamento de salários; empréstimo recebido.','Venda de imobilizado; recebimento de clientes; amortização de empréstimos.','Recebimento de empréstimo bancário; emissão de ações em dinheiro; pagamento do principal de empréstimo.','Compra de estoques; emissão de ações; aquisição de intangível.','Pagamento a fornecedores; venda de máquinas; recebimento de empréstimos.'],a:2,e:'Captação de empréstimos, emissão de instrumentos patrimoniais em dinheiro e amortização do principal de empréstimos alteram o capital próprio ou de terceiros e integram financiamento.'},
{q:'Uma empresa comprou um imóvel para uso próprio por R$ 500.000, sendo R$ 150.000 pagos à vista e R$ 350.000 financiados diretamente pelo vendedor, sem desembolso no período. Qual valor entra no fluxo de investimento na data da compra?',o:['R$ 500.000 de saída.','R$ 350.000 de saída.','Nenhum valor, pois houve financiamento.','R$ 150.000 de saída.','R$ 500.000 de entrada.'],a:3,e:'A DFC registra somente o caixa efetivamente movimentado: saída de R$ 150.000 em investimento. A parcela sem caixa fica fora da DFC naquele momento e deve ser divulgada conforme aplicável.'},
{q:'Uma sociedade pagou R$ 80.000 a fornecedores de mercadorias, R$ 40.000 de salários e R$ 20.000 de tributos sobre o lucro. Considerando esses pagamentos, qual é o fluxo operacional líquido?',o:['Saída de R$ 100.000.','Entrada de R$ 140.000.','Saída de R$ 120.000.','Entrada de R$ 20.000.','Saída de R$ 140.000.'],a:4,e:'Pagamentos operacionais: R$ 80.000 + R$ 40.000 + R$ 20.000 = R$ 140.000 de saída. Admite-se que os tributos não estejam especificamente identificados com investimento ou financiamento.'},
{q:'Uma entidade emitiu ações e recebeu R$ 300.000 em dinheiro, contraiu empréstimo de R$ 100.000 e amortizou R$ 70.000 do principal de dívida anterior. Qual o fluxo líquido de financiamento?',o:['Entrada líquida de R$ 330.000.','Entrada líquida de R$ 470.000.','Entrada líquida de R$ 230.000.','Saída líquida de R$ 330.000.','Entrada líquida de R$ 400.000.'],a:0,e:'Financiamento = R$ 300.000 + R$ 100.000 − R$ 70.000 = entrada líquida de R$ 330.000.'},
{q:'De acordo com o CPC 03 (R2), assinale a alternativa correta sobre juros e dividendos na DFC de entidade não financeira.',o:['Juros pagos são obrigatoriamente investimento.','Dividendos pagos podem ser classificados como financiamento ou, alternativamente, como operacionais, de forma consistente.','Dividendos recebidos são obrigatoriamente financiamento.','Juros recebidos são obrigatoriamente operacionais.','Dividendos pagos não são apresentados na DFC.'],a:1,e:'O CPC 03 admite, para entidades não financeiras, alternativas de classificação para juros e dividendos, exigindo divulgação separada e consistência entre períodos. Dividendos pagos podem ser financiamento ou operacionais.'},
{q:'Assinale a alternativa que apresenta exclusivamente saídas de caixa de atividades de investimento.',o:['Pagamento a fornecedores; compra de máquinas; compra de patente.','Pagamento de empréstimos; compra de ações para controle; compra de máquinas.','Aquisição à vista de patente; compra à vista de máquinas; aquisição à vista de participação em controlada.','Compra de estoques; compra de patente; pagamento de salários.','Pagamento de dividendos; compra de equipamentos; pagamento de tributos operacionais.'],a:2,e:'Patentes, máquinas e participações societárias em controladas adquiridas com caixa são investimentos, observadas as regras específicas de apresentação para obtenção de controle.'},
{q:'Uma empresa recebeu R$ 450.000 de clientes, pagou R$ 220.000 a fornecedores e R$ 90.000 a empregados. Não ocorreram outros fluxos operacionais. Qual foi o caixa líquido das atividades operacionais?',o:['Entrada de R$ 230.000.','Saída de R$ 140.000.','Entrada de R$ 360.000.','Entrada de R$ 140.000.','Entrada de R$ 680.000.'],a:3,e:'Operacional = R$ 450.000 − R$ 220.000 − R$ 90.000 = entrada líquida de R$ 140.000.'},
{q:'Uma empresa apresenta os seguintes movimentos de caixa: recebimento de clientes R$ 200.000; aquisição de equipamento R$ 60.000; emissão de ações R$ 90.000; amortização do principal de empréstimo R$ 30.000. Qual alternativa apresenta, respectivamente, os fluxos líquidos operacional, de investimento e de financiamento?',o:['R$ 200.000; R$ 60.000; R$ 120.000, todos entradas.','R$ 200.000 de entrada; R$ 60.000 de saída; R$ 30.000 de saída.','R$ 140.000 de entrada; R$ 90.000 de entrada; R$ 30.000 de saída.','R$ 200.000 de entrada; R$ 60.000 de entrada; R$ 60.000 de saída.','R$ 200.000 de entrada; R$ 60.000 de saída; R$ 60.000 de entrada.'],a:4,e:'Operacional: +R$ 200.000. Investimento: −R$ 60.000. Financiamento: +R$ 90.000 − R$ 30.000 = +R$ 60.000.'}
];
const good=['Excelente! Você está dominando a DFC! 🌟','Muito bem! Cada acerto aproxima você da aprovação! 🏆','É assim que se constrói uma aprovação! 💪','Você está no caminho certo! Continue firme! 🚀','Mais um acerto! Seu esforço está dando resultado! ⭐'];const bad=['Não desanime! O erro de hoje vira o acerto de amanhã. 💪','Continue! Cada questão é uma oportunidade de aprender. 🌟','Persistência é o segredo. Você consegue! 🚀','Errou? Aprenda com a resolução e siga em frente! 📘','Quem treina de verdade evolui a cada tentativa! 🏆'];let order=[],answers={},page=-1;const el=document.getElementById('screen'),bar=document.getElementById('bar');function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function init(){order=shuffle(qs.map((_,i)=>i));answers={};page=-1;render()}function choose(i){const id=order[page];if(answers[id]!==undefined)return;answers[id]=i;render()}function render(){const done=Object.keys(answers).length;bar.style.width=(done/qs.length*100)+'%';document.getElementById('prev').disabled=page===-1;document.getElementById('next').textContent=page===-1?'Começar ➡':page===qs.length?'↻ Novo treino':page===qs.length-1?'Ver escore ➡':'Avançar ➡';if(page===-1){el.innerHTML='<div class="cover"><div class="tag">MÉTODO MOREIRA</div><h1>DFC</h1><h2>DEMONSTRAÇÃO DOS FLUXOS DE CAIXA</h2><h1>TREINAMENTO PESADO</h1><p class="big">10 questões inéditas • Operacional • Investimento • Financiamento</p><p class="muted">Ordem aleatória a cada reinício • Correção comentada • Motivação a cada resposta • Escore final</p><div class="tag">🔥 VAMOS BUSCAR A APROVAÇÃO!</div></div>';return}if(page===qs.length){let score=order.reduce((s,id)=>s+(answers[id]===qs[id].a?1:0),0);let percent=Math.round(score/10*100);el.innerHTML='<div class="cover"><div class="tag">RESULTADO FINAL</div><h1>SEU ESCORE</h1><div class="score">'+score+' / 10</div><h2>'+percent+'% DE ACERTOS</h2><p class="big">'+(score===10?'PERFEITO! Treinamento concluído com excelência! 🏆':score>=7?'Muito bem! Revise os erros e continue evoluindo! 🚀':'Não pare agora! Reveja as resoluções e tente novamente! 💪')+'</p><p class="muted">Use Voltar para revisar suas respostas ou Reiniciar para embaralhar as questões e treinar de novo.</p></div>';return}let id=order[page],q=qs[id],selected=answers[id],answered=selected!==undefined,correct=answered&&selected===q.a;el.innerHTML='<div class="tag">QUESTÃO '+(page+1)+' DE 10</div><p class="big">'+q.q+'</p><div class="options">'+q.o.map((v,i)=>'<button class="option '+(answered?(i===q.a?'good':i===selected?'bad':''):'')+'" '+(answered?'disabled':'')+' data-i="'+i+'"><b>'+String.fromCharCode(65+i)+')</b> '+v+'</button>').join('')+'</div>'+(answered?'<div class="feedback"><strong>'+(correct?'✅ ACERTOU!':'❌ VAMOS APRENDER!')+'</strong><p>'+ (correct?good[page%good.length]:bad[page%bad.length])+'</p><strong>Resolução comentada:</strong><p>'+q.e+'</p><strong>Gabarito: '+String.fromCharCode(65+q.a)+'</strong></div>':'<p class="muted">Escolha uma alternativa para ver a resolução e uma mensagem motivacional.</p>');el.querySelectorAll('[data-i]').forEach(b=>b.addEventListener('click',()=>choose(+b.dataset.i)))}document.getElementById('prev').onclick=()=>{if(page>-1){page--;render();scrollTo(0,0)}};document.getElementById('next').onclick=()=>{if(page===qs.length){init();return}if(page===qs.length-1&&Object.keys(answers).length<10){alert('Responda todas as 10 questões antes de ver o escore.');return}if(page<qs.length){page++;render();scrollTo(0,0)}};document.getElementById('reset').onclick=()=>{if(confirm('Reiniciar o treinamento e embaralhar as questões?'))init()};init();
</script></body></html>
